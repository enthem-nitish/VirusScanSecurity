
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="VirusScan Security — AI-assisted Android APK security analysis and risk assessment platform."
    >

    <title>VirusScan Security — Android Security Intelligence</title>

    <style>
        /* =========================================================
           VIRUSSCAN SECURITY
           Single-file stylesheet
           Color Palette:
           Background: #F7F5F0
           White:      #FFFFFF
           Text:       #17202A
           Coral:      #E4573D
           Slate:      #52677A
           Green:      #16805C
           Amber:      #C98200
           Critical:   #C9362B
           Gray:       #667085
           Border:     #D9DDE3
           Hover:      #F2F3F5
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #F7F5F0;
            --white: #FFFFFF;
            --text: #17202A;
            --primary: #E4573D;
            --secondary: #52677A;
            --safe: #16805C;
            --suspicious: #C98200;
            --critical: #C9362B;
            --secondary-text: #667085;
            --border: #D9DDE3;
            --hover: #F2F3F5;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            position: relative;
        }

        /* =========================================================
           BACKGROUND
        ========================================================= */

        .auth-bg-grid {
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(217, 221, 227, 0.45) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(217, 221, 227, 0.45) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.8),
                transparent
            );

            pointer-events: none;
        }

        .auth-bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            opacity: 0.18;
        }

        .auth-bg-orb--1 {
            width: 380px;
            height: 380px;
            background: var(--primary);
            top: -180px;
            left: -120px;
        }

        .auth-bg-orb--2 {
            width: 320px;
            height: 320px;
            background: var(--secondary);
            right: -120px;
            bottom: -100px;
        }

        .auth-bg-orb--3 {
            width: 220px;
            height: 220px;
            background: var(--safe);
            right: 15%;
            top: 12%;
            opacity: 0.08;
        }

        /* =========================================================
           AUTH CARD
        ========================================================= */

        .auth-card {
            width: min(92%, 480px);

            background: var(--white);

            border: 1px solid var(--border);
            border-radius: 24px;

            padding: 46px 42px 38px;

            text-align: center;

            position: relative;
            z-index: 2;

            box-shadow:
                0 25px 70px rgba(23, 32, 42, 0.10),
                0 4px 14px rgba(23, 32, 42, 0.05);

            animation: cardAppear 0.55s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================================================
           SHIELD / LOGO
        ========================================================= */

        .auth-shield-icon {
            width: 78px;
            height: 78px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background: rgba(228, 87, 61, 0.08);
            border: 1px solid rgba(228, 87, 61, 0.20);

            color: var(--primary);

            font-size: 38px;

            box-shadow:
                0 10px 25px rgba(228, 87, 61, 0.10);
        }

        /* =========================================================
           TEXT
        ========================================================= */

        .auth-title {
            color: var(--text);

            font-size: clamp(28px, 5vw, 34px);
            line-height: 1.15;
            font-weight: 800;

            letter-spacing: -0.7px;

            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--secondary);

            font-size: 15px;
            font-weight: 600;

            letter-spacing: 0.3px;

            margin-bottom: 22px;
        }

        .auth-description {
            max-width: 370px;
            margin: 0 auto 30px;

            color: var(--secondary-text);

            font-size: 14px;
            line-height: 1.7;
        }

        /* =========================================================
           MAIN BUTTON
        ========================================================= */

        .auth-google-btn {
            width: 100%;
            min-height: 56px;

            border: none;
            border-radius: 13px;

            background: var(--primary);
            color: var(--white);

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 15px 22px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(228, 87, 61, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .auth-google-btn:hover {
            background: #D94C34;

            transform: translateY(-2px);

            box-shadow:
                0 12px 28px rgba(228, 87, 61, 0.28);
        }

        .auth-google-btn:active {
            transform: translateY(0);
        }

        .auth-google-btn:focus-visible {
            outline: 3px solid rgba(228, 87, 61, 0.25);
            outline-offset: 3px;
        }

        .auth-google-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* =========================================================
           SECURITY FEATURES
        ========================================================= */

        .auth-features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 10px;

            margin-top: 30px;
            padding-top: 26px;

            border-top: 1px solid var(--border);
        }

        .auth-feature {
            min-height: 82px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 8px;

            border-radius: 12px;

            background: var(--background);
            border: 1px solid transparent;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .auth-feature:hover {
            background: var(--hover);
            border-color: var(--border);
            transform: translateY(-2px);
        }

        .auth-feature-icon {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background: var(--white);
            border: 1px solid var(--border);

            font-size: 16px;
        }

        .auth-feature:nth-child(1) .auth-feature-icon {
            color: var(--secondary);
        }

        .auth-feature:nth-child(2) .auth-feature-icon {
            color: var(--safe);
        }

        .auth-feature:nth-child(3) .auth-feature-icon {
            color: var(--primary);
        }

        .auth-feature-label {
            color: var(--secondary-text);

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.2px;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 600px) {
            body {
                padding: 20px;
                overflow-y: auto;
            }

            .auth-card {
                width: 100%;
                padding: 36px 24px 28px;
                border-radius: 20px;
            }

            .auth-shield-icon {
                width: 68px;
                height: 68px;
                font-size: 32px;
            }

            .auth-title {
                font-size: 27px;
            }

            .auth-description {
                font-size: 13px;
            }

            .auth-features {
                gap: 7px;
            }

            .auth-feature {
                min-height: 76px;
            }
        }

        @media (max-width: 380px) {
            .auth-card {
                padding: 30px 18px 24px;
            }

            .auth-features {
                grid-template-columns: 1fr;
            }

            .auth-feature {
                min-height: 58px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 10px 14px;
            }
        }

        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="auth-page">

    <!-- Background -->
    <div class="auth-bg-grid"></div>
    <div class="auth-bg-orb auth-bg-orb--1"></div>
    <div class="auth-bg-orb auth-bg-orb--2"></div>
    <div class="auth-bg-orb auth-bg-orb--3"></div>

    <!-- Authentication Card -->
    <main class="auth-card">

        <div class="auth-shield-icon" aria-hidden="true">
            🔎︎
        </div>

        <h1 class="auth-title">
            VirusScan Security
        </h1>

        <p class="auth-subtitle">
            Android Security Intelligence
        </p>

        <p class="auth-description">
            Analyze Android applications before you install them.
            Detect malware, suspicious permissions, and risky behavior.
        </p>

        <button
            type="button"
            class="auth-google-btn"
            id="btn-google-signin"
        >
            <span aria-hidden="true">🛡</span>
            Try Our AI Based Protector
        </button>

        <div class="auth-features">

            <div class="auth-feature">
                <div class="auth-feature-icon" aria-hidden="true">
                    🔍
                </div>

                <div class="auth-feature-label">
                    APK Scan
                </div>
            </div>

            <div class="auth-feature">
                <div class="auth-feature-icon" aria-hidden="true">
                    📜
                </div>

                <div class="auth-feature-label">
                    Cert Verify
                </div>
            </div>

            <div class="auth-feature">
                <div class="auth-feature-icon" aria-hidden="true">
                    🛡
                </div>

                <div class="auth-feature-label">
                    Protection
                </div>
            </div>

        </div>

    </main>

    <!-- Existing application JavaScript -->
    <script src="js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // If already signed in, redirect to home
            if (
                typeof Auth !== 'undefined' &&
                typeof Auth.isLoggedIn === 'function' &&
                Auth.isLoggedIn()
            ) {
                window.location.href = '/home';
                return;
            }

            // AI Protector button
            const googleButton =
                document.getElementById('btn-google-signin');

            if (googleButton) {
                googleButton.addEventListener('click', () => {

                    if (
                        typeof Auth !== 'undefined' &&
                        typeof Auth.mockGoogleSignIn === 'function'
                    ) {
                        Auth.mockGoogleSignIn();
                    } else {
                        // Fallback if Auth is unavailable
                        window.location.href = '/home';
                    }

                });
            }

        });
    </script>

</body>
</html>
